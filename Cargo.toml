[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/policy-engine",
    "crates/finality-authority",
    "crates/settlement-engine",
    "crates/identity-registry",
    "crates/position-ledger",
    "crates/asset-ledger",
    "crates/protocol-coordinator",
    "crates/icp-canister-suite",
    "crates/shared-testkit",
]

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
policy-engine = { path = "crates/policy-engine" }
finality-authority = { path = "crates/finality-authority" }
settlement-engine = { path = "crates/settlement-engine" }
identity-registry = { path = "crates/identity-registry" }
position-ledger = { path = "crates/position-ledger" }
asset-ledger = { path = "crates/asset-ledger" }
protocol-coordinator = { path = "crates/protocol-coordinator" }
icp-canister-suite = { path = "crates/icp-canister-suite" }
shared-testkit = { path = "crates/shared-testkit" }

# Serialization, Types & Runtime
candid = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Error Handling & Observability
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Types & Math
uuid = { version = "1.8", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde-with-str"] }

# Cryptography & Hashing
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
